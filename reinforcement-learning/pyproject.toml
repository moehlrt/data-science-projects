version = "0.1.0"
description = "Unsupervised and Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Moritz Ehlert" }]

dependencies = [
    "gymnasium>=1.3,<2",
    "ipykernel>=6.30,<7",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "notebook>=7.4,<8",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "plotly>=6.3,<7",
    "scikit-learn>=1.8,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
    "torch>=2.10,<3",
    "yfinance>=1.2,<2",
]

[tool.uv]
package = false
